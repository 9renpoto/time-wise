[package]
name = "time-wise-server"
version.workspace = true
edition.workspace = true
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest"] }
serde_json = "1"
worker = "0.8.5"

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Type: Maintenance"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Type: Maintenance"
    groups:
      actions:
        patterns:
          - "actions/*"
      jetli:
        patterns:
          - "jetli/*"
      taiki-e:
        patterns:
          - "taiki-e/*"
      tauri-apps:
        patterns:
          - "tauri-apps/*"
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Type: Maintenance"
    groups:
      tauri:
        patterns:
          - "tauri*"
      serde:
        patterns:
          - "serde*"
      rustwasm:
        patterns:
          - "worker"
          - "worker-sys"
          - "worker-macros"
          - "wasm-bindgen*"
          - "js-sys"
          - "web-sys"
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Type: Maintenance"
    cooldown:
      default-days: 7

  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "Type: Maintenance"
    cooldown:
      default-days: 7

name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/book.toml"
      - "docs/en/book.toml"
      - "docs/src/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/book.toml"
      - "docs/en/book.toml"
      - "docs/src/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      badge-run-id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: mdbook@0.5.4

      - name: Build documentation
        run: |
          mdbook build docs
          mdbook build docs/en

      - name: Include coverage badges
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_RUN_ID: ${{ inputs.badge-run-id }}
        run: |
          if [[ -z "$BADGE_RUN_ID" ]]; then
            BADGE_RUN_ID=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=coverage-badges&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | first | .workflow_run.id // empty')
          fi
          if [[ -z "$BADGE_RUN_ID" ]]; then
            echo "No coverage badges have been published on main yet."
            exit 0
          fi
          gh run download "$BADGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name coverage-badges --dir "$RUNNER_TEMP/coverage-badges"
          mkdir -p docs/book/badges
          cp "$RUNNER_TEMP/coverage-badges/"*.svg docs/book/badges/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

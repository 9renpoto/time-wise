name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select verification scope
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      windows: ${{ steps.scope.outputs.windows }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check application version consistency
        run: node .github/scripts/set-version.mjs --check

      - name: Detect relevant changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_sha="${PR_BASE_SHA:-$BEFORE_SHA}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          verify=false
          windows=false

          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|.github/workflows/ci.yml|.github/workflows/tauri-release.yml|apps/desktop/src-tauri/*)
                verify=true
                windows=true
                ;;
              apps/desktop/*|apps/server/*)
                verify=true
                ;;
            esac
          done < <(git diff --name-only "$base_sha" "$GITHUB_SHA")

          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  workspace:
    name: Workspace (Ubuntu)
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
              build-essential \
              curl \
              wget \
              file \
              libxdo-dev \
              libssl-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev

      - name: Install Rust toolchain
        # The channel, components, and targets come from rust-toolchain.toml so
        # that CI and local builds always resolve the same toolchain.
        run: rustup show active-toolchain

      - name: Install trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: 'latest'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy for the workspace
        run: cargo clippy --workspace --bins --tests --examples -- -D rust_2018_idioms -D warnings

      - name: Install grcov
        run: cargo install grcov

      - name: Run workspace tests with coverage
        env:
          RUSTFLAGS: "-C instrument-coverage"
          LLVM_PROFILE_FILE: "cargo-test-%p.profraw"
        run: cargo nextest run --workspace --profile ci

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results

      - name: Build portable frontend
        working-directory: apps/desktop
        run: trunk build

      - name: Generate coverage report
        run: grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore "target/*" --ignore ".cargo/*" -o lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  windows-platform:
    name: Windows platform
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # The channel, components, and targets come from rust-toolchain.toml.
        run: rustup show active-toolchain

      - name: Run Clippy for the Windows backend
        run: cargo clippy -p time-wise --lib --tests -- -D rust_2018_idioms -D warnings

      - name: Run Windows backend tests
        run: cargo test -p time-wise --lib

      - name: Install trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: 'latest'

      - name: Build Windows NSIS installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: --bundles nsis
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: windows-[arch]-[bundle]

  build-and-test:
    name: build-and-test
    if: always()
    needs: [changes, workspace, windows-platform]
    runs-on: ubuntu-slim

    steps:
      - name: Require successful build and test jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY: ${{ needs.changes.outputs.verify }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          WINDOWS_RESULT: ${{ needs.windows-platform.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          if [[ "$VERIFY" == true && "$WORKSPACE_RESULT" != success ]]; then
            echo "Workspace verification did not succeed: $WORKSPACE_RESULT"
            exit 1
          fi

          if [[ "$VERIFY" != true && "$WORKSPACE_RESULT" != skipped ]]; then
            echo "Workspace verification should have been skipped: $WORKSPACE_RESULT"
            exit 1
          fi

          if [[ "$WINDOWS" == true && "$WINDOWS_RESULT" != success ]]; then
            echo "Windows verification did not succeed: $WINDOWS_RESULT"
            exit 1
          fi

          if [[ "$WINDOWS" != true && "$WINDOWS_RESULT" != skipped ]]; then
            echo "Windows verification should have been skipped: $WINDOWS_RESULT"
            exit 1
          fi

name: Secretlint
on: push
permissions:
  contents: read
jobs:
  test:
    name: "Secretlint"
    runs-on: ubuntu-latest
    container: secretlint/secretlint:v8.1.0
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint with Secretlint
        run: secretlint "**/*"
